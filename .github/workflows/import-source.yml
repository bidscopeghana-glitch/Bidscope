name: Import BidScope source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit the website
        run: |
          temp_dir="$(mktemp -d)"
          unzip -q bidscope-ghana-source.zip -d "$temp_dir"
          rsync -a --exclude '.git' "$temp_dir/" ./
          rm -f bidscope-ghana-source.zip .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import BidScope Ghana website"
          git push origin HEAD:main
