name: Publish BidScope backend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-backend.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend payload
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/bidscope-backend.zip
          unzip -o /tmp/bidscope-backend.zip -d .
          npm ci
          npm run test:backend
          npm run lint
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build BidScope production backend'
          git push
      - name: Remove one-time publisher
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/publish-backend.yml
          git commit -m 'Remove temporary backend publisher'
          git push
