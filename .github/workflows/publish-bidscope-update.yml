name: Publish BidScope update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified workspace update
        shell: bash
        env:
          ARCHIVE_B64: 
        run: |
          printf '%s' "$ARCHIVE_B64" | base64 -d > /tmp/bidscope-update.tar.gz
          tar -xzf /tmp/bidscope-update.tar.gz
          rm -f .github/workflows/publish-bidscope-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate World Bank procurement intelligence"
          git push
